#################
#HYPRLANG CONFIG#
#################

### KEYBINDS
$mainMod = SUPER
##Applications/Scripts
bind = $mainMod, T, exec, foot
bind = $mainMod, E, exec, pcmanfm
bind = $mainMod, B, exec, helium
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, W, exec, ~/Downloads/Wallpapers/wallpaperselect.sh
bind = CTRL SHIFT, Tab, exec, foot --app-id=btop btop
## Window Management
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, P, togglespecialworkspace, magic
bind = $mainMod, F, togglefloating,
bind = $mainMod, O, pseudo,
bind = $mainMod, J, layoutmsg, swapwithmaster
bind = $mainMod, F12, exec, grimblast save area ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
## Move / Swap Windows
bind = $mainMod, LEFT,  movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP,    movefocus, u
bind = $mainMod, DOWN,  movefocus, d
bind = $mainMod SHIFT, LEFT,  swapwindow, l
bind = $mainMod SHIFT, RIGHT, swapwindow, r
bind = $mainMod SHIFT, UP,    swapwindow, u
bind = $mainMod SHIFT, DOWN,  swapwindow, d
bind = $mainMod CTRL, LEFT,  movewindow, l
bind = $mainMod CTRL, RIGHT, movewindow, r
bind = $mainMod CTRL, UP,    movewindow, u
bind = $mainMod CTRL, DOWN,  movewindow, d
## Workspaces
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
## Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
## Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
## Brightness
bind = $mainMod, XF86AudioRaiseVolume, exec, hyprctl hyprsunset gamma +10
bind = $mainMod, XF86AudioLowerVolume, exec, hyprctl hyprsunset gamma -10
bind = CTRL, XF86AudioRaiseVolume, exec, hyprctl hyprsunset temperature +500
bind = CTRL, XF86AudioLowerVolume, exec, hyprctl hyprsunset temperature -500
## Media
bindl = , F9, exec, playerctl next
bindl = , F8, exec, playerctl play-pause
bind  = , XF86AudioPlay, exec, playerctl play-pause
bindl = , F7, exec, playerctl previous

### MONITORS
monitor = DP-1, 1920x1080@120.40Hz, 0x-40, 1, cm, srgb, vrr, 0
monitor = DP-2, 1920x1080@165.00Hz, 1920x-80, 1, cm, srgb, vrr, 1

### PROGRAMS
$fileManager = pcmanfm

### AUTOSTART
exec-once = waybar
exec-once = hyprpaperr
exec-once = lxqt-policykit-agent
exec-once = hyprsunset
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = easyeffects --gapplication-service
exec-once = qpwgraph --minimized
exec-once = ~/.local/bin/link-minecraft-obs.sh
exec-once = pkill keymapper; sleep 0.5 && keymapper -u
exec-once = systemctl --user start hyprland-session.target

### ENVIRONMENT VARIABLES
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita-dark
env = MOZ_ENABLE_WAYLAND,1
env = KDEDIRS,/usr
env = XDG_CURRENT_DESKTOP,Hyprland
env = DISPLAY,:0
env = WLR_NO_HARDWARE_CURSORS,1
env = PROTON_ENABLE_NVAPI,1

### PERMISSIONS
permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

### LOOK AND FEEL
general {
    gaps_in = 3
    gaps_out = 5

    border_size = 1

    col.active_border = rgba(ffffffff) rgba(ffffffff) 45deg
    col.inactive_border = rgba(ffffffff)

    resize_on_border = false
    allow_tearing = true

    layout = dwindle
    snap {
        enabled = true
    }
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = false

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 2
}

xwayland {
    enabled = true
}

### INPUT
gesture = 3, horizontal, workspace

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = -0.93
    force_no_accel = false
    accel_profile = flat
    repeat_delay = 500
    repeat_rate = 30
}

device {
    name = endgame-gear-endgame-gear-op1-8k-gaming-mouse
    sensitivity = -0.93
    accel_profile = flat
}

### WINDOWS AND WORKSPACES
windowrule {
    name = tearing-fullscreen
    immediate = true
    match:fullscreen = true
}

windowrule {
    name = tearing-steam-games
    immediate = true
    match:class = (steam_app_.*)
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

workspace = 1, monitor:DP-2, default:true

windowrule {
    name = foot
    float = true
    size = 925 300
    match {
        class = foot
    }
}

windowrule {
    name = btop-size
    float = true
    size = 725 360
    match {
        class = btop
    }
}
